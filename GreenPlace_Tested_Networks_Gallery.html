 r.edges.forEach(([u,v])=>{const a=P(r.pos[u]),b=P(r.pos[v]);s+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="var(--l)" stroke-width="${big?1.6:1}"/>`});
 r.pos.forEach((p,i)=>{const q=P(p);s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${(big?3:2)+Math.min(r.deg[i],6)*(big?.7:.4)}" fill="${col}"><title>node ${i}, degree ${r.deg[i]}</title></circle>`});return s+"</svg>"}
function draw(){const q=$("q").value.toLowerCase(),k=$("sort").value;let L=D.nets.filter(r=>r.name.toLowerCase().includes(q));
 L.sort((a,b)=>k==="n"?a.n-b.n||a.name.localeCompare(b.name):k==="name"?a.name.localeCompare(b.name):(a.pct===null)-(b.pct===null)||a.pct-b.pct);
 $("cnt").textContent=`${L.length} shown - GreenPlace fewer migrations on ${nW}, more on ${nL}`;
 $("g").innerHTML=L.map(r=>`<div class="card ${cls(r)}" data-n="${r.name}">${svg(r)}<div class="nm">${r.name}</div><div class="mut">${r.n} nodes, ${r.m} links${r.geo?"":" (hop-count delay)"}</div><div class="tg">${tag(r)}</div></div>`).join("");
 document.querySelectorAll(".card").forEach(e=>e.onclick=()=>{const r=D.nets.find(x=>x.name===e.dataset.n);$("dbody").innerHTML=`<h2>${r.name}</h2>${svg(r,true)}<table><tr><td>switches / links</td><td>${r.n} / ${r.m}</td></tr><tr><td>delay bound</td><td>${r.bound} ms (0.35 x delay diameter)</td></tr><tr><td>controller capacity</td><td>${r.cap} switches</td></tr><tr><td>minimum pool size</td><td>${r.K} controllers</td></tr><tr><td>migrations / day (mean of seeds)</td><td>GreenPlace ${r.gp}, NSGA-II ${r.n2}</td></tr><tr><td>daily energy change</td><td>${r.de>0?"+":""}${r.de}% (GreenPlace vs NSGA-II)</td></tr></table>`;$("dlg").showModal()})}
$("q").oninput=draw;$("sort").onchange=draw;draw();
$("new").innerHTML=D.new.length?`<b>Added to the data folder but not part of the reported study:</b> ${D.new.map(x=>x.name+" ("+x.n+" nodes)").join(", ")}. Re-run <code>python scripts/run_study3.py --names ...</code> and the analysis to include them.`:`<b>Not in the study.</b> Every file in <code>data/real_topologies/</code> within 10-60 nodes was run. Networks outside that range (e.g. Cogentco 180, Kdl 709) appear only in the scale study.`;
</script></body></html>
